<!doctype html>
<html lang="en" dir="ltr" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />

    <!-- Typography: Fraunces (editorial display) + Space Grotesk (technical UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <!--
      Locale resolved before first paint so a stored Arabic choice never flashes
      as LTR. Mirrors resolveLocale() in src/i18n/index.ts; English (the default)
      touches nothing and loads no extra font. Kept inline and dependency-free
      on purpose — it must run before the app bundle.
    -->
    <script>
      (function () {
        var locale = "en";
        try {
          var fromUrl = new URLSearchParams(location.search).get("lang");
          if (fromUrl === "ar" || fromUrl === "en") {
            locale = fromUrl;
          } else {
            var stored = localStorage.getItem("triple-locale");
            if (stored === "ar" || stored === "en") locale = stored;
          }
        } catch (e) {
          /* blocked storage or malformed query — keep the English default */
        }
        if (locale === "en") return;
        var root = document.documentElement;
        root.lang = "ar";
        root.dir = "rtl";
        var font = document.createElement("link");
        font.id = "ar-fonts";
        font.rel = "stylesheet";
        font.href =
          "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap";
        document.head.appendChild(font);
      })();
    </script>

    <title>Tripple — Strategy, Design &amp; Technology</title>
    <meta
      name="description"
      content="Tripple is a multidisciplinary digital studio creating thoughtful products, brands and digital experiences through strategy, design and technology."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tripple — Strategy, Design & Technology" />
    <meta
      property="og:description"
      content="An independent digital studio bringing strategy, design and technology into one focused team."
    />
    <meta property="og:site_name" content="Tripple" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tripple — Strategy, Design & Technology" />
    <meta
      name="twitter:description"
      content="An independent digital studio bringing strategy, design and technology into one focused team."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
